<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MD ZAHID HASAN RAFI | Official</title>

<meta name="description"

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

:root{
    --bg:#030712;
    --card:rgba(15,23,42,.65);
    --border:rgba(255,255,255,.10);
    --text:#f8fafc;
    --muted:#94a3b8;
    --cyan:#22d3ee;
    --blue:#3b82f6;
    --purple:#8b5cf6;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
}

/* ===============================
   BACKGROUND
================================ */

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:var(--blue);
    filter:blur(180px);
    opacity:.18;
    top:-200px;
    left:-200px;
    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:var(--purple);
    filter:blur(180px);
    opacity:.16;
    right:-200px;
    bottom:-200px;
    z-index:-2;
}

/* ===============================
   NAVBAR
================================ */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:16px 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(3,7,18,.65);
    backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
    z-index:999;
}

.logo{
    font-size:22px;
    font-weight:bold;
    letter-spacing:2px;
    color:var(--cyan);
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:14px;
    transition:.3s;
}

.nav-links a:hover{
    color:var(--cyan);
}

/* ===============================
   HERO
================================ */

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:120px 20px 70px;
    position:relative;
}

.hero-content{
    max-width:850px;
}

.badge{
    display:inline-block;
    padding:8px 18px;
    border:1px solid rgba(34,211,238,.3);
    background:rgba(34,211,238,.08);
    border-radius:50px;
    color:var(--cyan);
    font-size:13px;
    margin-bottom:25px;
}

.profile-wrap{
    position:relative;
    display:inline-block;
    margin-bottom:25px;
}

.profile{
    width:160px;
    height:160px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid var(--cyan);
    box-shadow:
        0 0 25px rgba(34,211,238,.4),
        0 0 70px rgba(59,130,246,.2);
}

.profile-wrap::before{
    content:"";
    position:absolute;
    inset:-12px;
    border:1px solid rgba(34,211,238,.4);
    border-radius:50%;
    animation:spin 8s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0)}
    to{transform:rotate(360deg)}
}

.hero h1{
    font-size:clamp(36px,7vw,72px);
    line-height:1.05;
    margin-bottom:20px;
}

.hero h1 span{
    background:linear-gradient(
        90deg,
        var(--cyan),
        var(--blue),
        var(--purple)
    );
    -webkit-background-clip:text;
    color:transparent;
}

.typing{
    color:var(--muted);
    font-size:20px;
    min-height:30px;
}

.cursor{
    color:var(--cyan);
    animation:blink .7s infinite;
}

@keyframes blink{
    50%{opacity:0}
}

/* ===============================
   BUTTON
================================ */

.buttons{
    margin-top:35px;
}

.btn{
    display:inline-block;
    padding:13px 27px;
    margin:6px;
    border-radius:50px;
    text-decoration:none;
    color:white;
    border:1px solid var(--border);
    background:rgba(255,255,255,.05);
    transition:.35s;
}

.btn.primary{
    background:linear-gradient(
        90deg,
        var(--blue),
        var(--purple)
    );
    border:none;
}

.btn:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 40px rgba(59,130,246,.25);
}

/* ===============================
   SECTIONS
================================ */

section{
    max-width:1100px;
    margin:auto;
    padding:100px 20px;
}

.section-title{
    text-align:center;
    margin-bottom:55px;
}

.section-title small{
    color:var(--cyan);
    letter-spacing:3px;
}

.section-title h2{
    font-size:42px;
    margin-top:10px;
}

   GLASS CARD
================================ */

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:25px;
